<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-row">
    <a class="logo" href="{{ '/' | relative_url }}">
      {% include ball.svg %}
      <span>{{ site.title }}</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>Menu</span>
    </button>
    <nav id="main-nav" class="main-nav" aria-label="Main">
      {% for s in site.data.sections %}
        {% assign s_url = '/' | append: s.slug | append: '/' %}
        <a href="{{ s_url | relative_url }}"{% if page.section == s.slug %} aria-current="page"{% endif %}>{{ s.title }}</a>
      {% endfor %}
    </nav>
    <form class="header-search" action="{{ '/search/' | relative_url }}" method="get" role="search">
      <label class="visually-hidden" for="header-q">Search the guides</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="header-q" type="search" name="q" placeholder="Search">
    </form>
  </div>
</header>
